name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate API base URL
        if: vars.API_BASE_URL == ''
        run: |
          echo "::error::Repository variable API_BASE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables."
          exit 1

      - name: Configure API base URL
        run: |
          printf 'window.API_BASE_URL = "%s";\n' "${{ vars.API_BASE_URL }}" > frontend/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
