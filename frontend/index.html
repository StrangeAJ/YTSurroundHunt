<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>YouTube Search</h1>
    <button class="toggle-theme-button" onclick="toggleTheme()">
      Toggle Dark Theme
    </button>
    <form id="search-form">
      <input type="text" id="query" name="query" size="32" required />
      <button type="submit">Search</button>
    </form>
    <ul id="flashes" class="flashes" aria-live="polite"></ul>
    <div
      id="progress-bar"
      class="progress-bar"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="progress-bar-inner"></div>
    </div>
    <div id="results"></div>
    <script src="config.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
